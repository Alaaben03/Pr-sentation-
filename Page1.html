<!DOCTYPE html>

<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Cover Slide - Adidas Case Study</title>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet"/>
<style>
        body { font-family: 'Cairo', sans-serif; }
        .adidas-skew { transform: skewX(-15deg); }
        .adidas-stripe { box-shadow: 2px 2px 10px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
<!-- Main Slide Container -->
<div class="w-[1280px] h-[720px] bg-white relative overflow-hidden flex shadow-2xl mx-auto">
<!-- Decorative Background Elements -->
<!-- Left Dark Section (The Brand Side) -->
<div class="absolute top-0 left-0 h-full w-[55%] bg-black adidas-skew -translate-x-20 z-0 border-r-8 border-gray-800"></div>
<!-- The Three Stripes (Iconic Identity) -->
<!-- Positioned to bridge the dark and light sections -->
<div class="absolute h-[120%] w-6 bg-white left-[38%] top-[-10%] adidas-skew z-10 adidas-stripe"></div>
<div class="absolute h-[120%] w-6 bg-white left-[42%] top-[-10%] adidas-skew z-10 adidas-stripe"></div>
<div class="absolute h-[120%] w-6 bg-white left-[46%] top-[-10%] adidas-skew z-10 adidas-stripe"></div>
<!-- Content Layout -->
<div class="relative z-20 w-full h-full flex">
<!-- Right Column: Academic Content (Text) -->
<div class="w-[55%] h-full flex flex-col justify-center px-16 text-right pt-10">
<!-- Decorative Top Line -->
<div class="w-24 h-2 bg-blue-900 mb-8 rounded-full"></div>
<!-- Main Title -->
<h1 class="text-6xl font-black text-gray-900 leading-tight mb-2">
                    عملية اتخاذ القرار
                </h1>
<h1 class="text-6xl font-black text-blue-900 leading-tight mb-6">
                    الشرائي في أسواق B2C
                </h1>
<!-- Subtitle -->
<div class="flex items-center mb-12">
<div class="w-2 h-12 bg-black ml-4 rounded-sm"></div>
<h2 class="text-3xl font-semibold text-gray-600">
                        دراسة حالة تطبيقية على شركة Adidas
                    </h2>
</div>
<!-- Info Box -->
<div class="grid grid-cols-1 gap-6 max-w-lg">
<!-- Researcher -->
<div class="flex items-center group">
<div class="w-12 h-12 rounded-full bg-gray-100 flex items-center justify-center text-blue-900 ml-4 group-hover:bg-blue-900 group-hover:text-white transition-colors duration-300">
<i class="fas fa-user-graduate text-xl"></i>
</div>
<div>
<p class="text-sm text-gray-500 font-bold uppercase tracking-wider mb-1">إعداد</p>
<p class="text-xl font-bold text-gray-800">[اسم الباحث/الطالبة]</p>
</div>
</div>
<!-- Institution -->
<div class="flex items-center group">
<div class="w-12 h-12 rounded-full bg-gray-100 flex items-center justify-center text-blue-900 ml-4 group-hover:bg-blue-900 group-hover:text-white transition-colors duration-300">
<i class="fas fa-university text-xl"></i>
</div>
<div>
<p class="text-sm text-gray-500 font-bold uppercase tracking-wider mb-1">الجهة / المقرر</p>
<p class="text-xl font-bold text-gray-800">[اسم الجامعة/المقرر]</p>
</div>
</div>
<!-- Date -->
<div class="flex items-center group">
<div class="w-12 h-12 rounded-full bg-gray-100 flex items-center justify-center text-blue-900 ml-4 group-hover:bg-blue-900 group-hover:text-white transition-colors duration-300">
<i class="fas fa-calendar-alt text-xl"></i>
</div>
<div>
<p class="text-sm text-gray-500 font-bold uppercase tracking-wider mb-1">التاريخ</p>
<p class="text-xl font-bold text-gray-800">2025-12-05</p>
</div>
</div>
</div>
</div>
<!-- Left Column: Visual Identity (Brand) -->
<div class="w-[45%] h-full flex flex-col justify-center items-center text-white relative pr-20">
<!-- Adidas Logo -->
<!-- Using a specific SVG URL for high quality rendering -->
<div class="w-72 mb-10 relative z-30 filter drop-shadow-2xl">
<img alt="Adidas Logo" class="w-full filter invert brightness-0" src="https://page.gensparksite.com/slides_images/e7c53b388a5195f665d9ba7008c08695.svg"/>
</div>
<div class="text-center relative z-30 opacity-90">
<p class="text-2xl font-light tracking-[0.2em] mb-2 text-gray-200">IMPOSSIBLE</p>
<p class="text-2xl font-bold tracking-[0.2em] text-white">IS NOTHING</p>
</div>
<!-- Abstract graphic element representing data/process -->
<div class="absolute bottom-10 left-10 flex space-x-2 space-x-reverse opacity-20">
<div class="w-2 h-12 bg-white rounded-full"></div>
<div class="w-2 h-16 bg-white rounded-full"></div>
<div class="w-2 h-10 bg-white rounded-full"></div>
<div class="w-2 h-20 bg-white rounded-full"></div>
<div class="w-2 h-14 bg-white rounded-full"></div>
</div>
</div>
</div>
<!-- Bottom Footer Line -->
<div class="absolute bottom-0 w-full h-3 bg-blue-900 z-50"></div>
</div>
</body>
</html>
